; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip ; PlatformIO does not support Seeed Studio boards - manual setup is required
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
lib_deps = 
    https://github.com/Love4yzp/seeed-mmwave-library.git ; mmWave radar sensor library
    knolleary/PubSubClient@^2.8  ; MQTT client library
    bblanchon/ArduinoJson@^7.0.4 ; JSON library for Arduino